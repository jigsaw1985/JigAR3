<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>TERA AR AC Drive</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.5/aframe/build/aframe-ar.js"></script>
<style>
body{margin:0;overflow:hidden}
#control{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99;text-align:center}
button{padding:12px 20px;margin:5px;font-size:18px;border-radius:8px}
#speed{background:white;padding:10px;border-radius:8px;font-size:22px}
</style>
</head>
<body>

<div id="control">
<div id="speed">Speed : 0 Hz</div>
<button onclick="change(5)">+ Speed</button>
<button onclick="change(-5)">- Speed</button>
<button onclick="stopMotor()">STOP</button>
</div>

<a-scene embedded arjs="sourceType:webcam;debugUIEnabled:false">

<!-- ใช้ Hiro Marker เป็นตัวทดสอบ
เปลี่ยนเป็น tera.patt หลังจาก Generate Marker -->
<a-marker preset="hiro">

<a-box position="0 0.5 0" scale="1 1.5 .35" color="#222"></a-box>

<a-box position="0 .75 .2" scale=".5 .25 .02" color="#00ff00"></a-box>

<a-text value="TERA AC DRIVE"
position="-0.8 1.5 0"
rotation="-90 0 0"
width="3"
color="white"></a-text>

<a-cylinder id="fan"
position="0 .5 .3"
radius=".25"
height=".05"
rotation="90 0 0"
color="#00aaff"></a-cylinder>

</a-marker>

<a-entity camera></a-entity>
</a-scene>

<script>
let speed=0;
let fan=document.querySelector("#fan");

function change(v){
speed+=v;
if(speed<0)speed=0;
if(speed>60)speed=60;
document.getElementById("speed").innerHTML="Speed : "+speed+" Hz";
if(speed>0){
fan.setAttribute("animation",
"property:rotation;to:90 "+speed*10+" 0;loop:true;dur:500");
}
}
function stopMotor(){
speed=0;
document.getElementById("speed").innerHTML="Speed : 0 Hz";
fan.removeAttribute("animation");
}
</script>

</body>
</html>
